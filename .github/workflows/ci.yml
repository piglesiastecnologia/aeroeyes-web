name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Web quality and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Web
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_MONITORING_API_URL: http://localhost:18000

      - name: Build Web image
        run: >-
          docker build
          --build-arg VITE_MONITORING_API_URL=http://localhost:18000
          --tag aeroeyes-web:ci
          .
