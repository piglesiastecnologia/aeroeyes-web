<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do AeroEyes Monitoring System</title>
  <desc id="description">Cenário 1.1 da PUC-Rio com AeroEyes Web, Monitoring API, PostgreSQL e AviationWeather, além do Attention Core como extensão opcional.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040a12"/><stop offset="0.58" stop-color="#0a1724"/><stop offset="1" stop-color="#07101a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14283b" stop-opacity=".96"/><stop offset="1" stop-color="#0c1b2a" stop-opacity=".96"/></linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13364a"/><stop offset="1" stop-color="#0d2738"/></linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193a5b"/><stop offset="1" stop-color="#102841"/></linearGradient>
    <linearGradient id="amberCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#493817"/><stop offset="1" stop-color="#2d260f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#36d9cf" stop-opacity=".23"/><stop offset="1" stop-color="#36d9cf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#5a7892" stroke-width="1" opacity=".09"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000713" flood-opacity=".52"/></filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43ded3"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69aef0"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f0bd5c"/></marker>
    <style>
      .display{font:700 39px Inter,Arial,sans-serif;fill:#f4f8fb}.subtitle{font:400 17px Inter,Arial,sans-serif;fill:#9fb4c7}.eyebrow{font:700 13px Inter,Arial,sans-serif;letter-spacing:2.4px;fill:#43ded3}.section{font:700 17px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#dce8f1}.cardTitle{font:700 25px Inter,Arial,sans-serif;fill:#f5f9fc}.cardSub{font:500 15px Inter,Arial,sans-serif;fill:#a9bfd0}.cardText{font:400 14px Inter,Arial,sans-serif;fill:#8fa8bc}.label{font:700 13px Inter,Arial,sans-serif;fill:#dce8f1}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#8099ad}.number{font:800 13px Inter,Arial,sans-serif;fill:#07131e}.flowTeal{fill:none;stroke:#43ded3;stroke-width:2.4;marker-end:url(#arrowTeal)}.flowBlue{fill:none;stroke:#69aef0;stroke-width:2.4;marker-end:url(#arrowBlue)}.flowAmber{fill:none;stroke:#f0bd5c;stroke-width:2.4;stroke-dasharray:10 9;marker-end:url(#arrowAmber)}.flowAmberLine{fill:none;stroke:#f0bd5c;stroke-width:2.2;stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1800" height="1125" fill="url(#bg)"/><rect width="1800" height="1125" fill="url(#grid)"/><circle cx="520" cy="320" r="420" fill="url(#glow)"/>

  <g transform="translate(58 46)"><circle cx="31" cy="31" r="29" fill="#0c2534" stroke="#43ded3" stroke-width="3"/><path d="M10 32Q31 12 52 32Q31 52 10 32Z" fill="none" stroke="#43ded3" stroke-width="4"/><circle cx="31" cy="32" r="8" fill="#f0bd5c" filter="url(#softGlow)"/></g>
  <text x="133" y="72" class="display">AeroEyes Monitoring System</text><text x="134" y="103" class="subtitle">Arquitetura do MVP · cenário 1.1 da PUC-Rio · visão de entrega</text>
  <g transform="translate(1430 48)"><rect width="310" height="54" rx="27" fill="#0d2534" stroke="#2b6072"/><circle cx="28" cy="27" r="6" fill="#43ded3" filter="url(#softGlow)"/><text x="51" y="33" class="label">ARQUITETURA CANÔNICA · v2</text></g>

  <g transform="translate(58 145)"><rect width="1684" height="682" rx="30" fill="url(#panel)" stroke="#29465c" stroke-width="2" filter="url(#shadow)"/><path d="M30 1H1654" stroke="#43ded3" stroke-width="3" opacity=".7"/>
    <text x="36" y="48" class="eyebrow">ENTREGA OBRIGATÓRIA</text><text x="36" y="82" class="section">CENÁRIO 1.1 · FRONTEND + BACKEND + API EXTERNA</text>
    <g transform="translate(1318 28)"><rect width="322" height="58" rx="16" fill="#0a1925" stroke="#29465c"/><text x="18" y="24" class="tiny">LIMITE DE EXECUÇÃO</text><text x="18" y="45" class="label">Docker Compose · Web / API / DB</text></g>

    <g transform="translate(44 170)" filter="url(#shadow)"><rect width="210" height="310" rx="24" fill="#0b1b29" stroke="#31536c" stroke-width="2"/><rect x="18" y="18" width="174" height="36" rx="18" fill="#102c3d"/><text x="105" y="42" text-anchor="middle" class="label">OPERADOR</text><rect x="45" y="91" width="120" height="83" rx="10" fill="none" stroke="#70a6cd" stroke-width="5"/><path d="M31 194H179" stroke="#70a6cd" stroke-width="6" stroke-linecap="round"/><circle cx="105" cy="241" r="21" fill="#102c3d"/><path d="M94 242l8 8 16-19" fill="none" stroke="#43ded3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="287" text-anchor="middle" class="cardText">Browser</text></g>

    <g transform="translate(338 140)" filter="url(#shadow)"><rect width="320" height="370" rx="26" fill="url(#tealCard)" stroke="#43ded3" stroke-width="2.5"/><rect x="22" y="22" width="50" height="28" rx="14" fill="#43ded3"/><text x="47" y="41" text-anchor="middle" class="number">01</text><text x="24" y="94" class="cardTitle">AeroEyes Web</text><text x="24" y="123" class="cardSub">React · TypeScript · Vite</text><path d="M24 151H296" stroke="#2e6874"/>
      <g transform="translate(25 176)"><rect width="270" height="58" rx="14" fill="#0c2130"/><circle cx="28" cy="29" r="10" fill="#43ded3" opacity=".18"/><path d="M23 29h10M28 24v10" stroke="#43ded3" stroke-width="2"/><text x="50" y="25" class="label">Monitoring console</text><text x="50" y="43" class="tiny">Sessão · contexto · atenção</text></g>
      <g transform="translate(25 247)"><rect width="270" height="58" rx="14" fill="#0c2130"/><circle cx="28" cy="29" r="10" fill="#69aef0" opacity=".2"/><path d="M22 29l5 5 9-11" fill="none" stroke="#69aef0" stroke-width="2"/><text x="50" y="25" class="label">Weather / METAR</text><text x="50" y="43" class="tiny">Somente via backend</text></g><text x="24" y="344" class="tiny">Interface principal avaliada</text></g>

    <g transform="translate(765 118)" filter="url(#shadow)"><rect width="420" height="414" rx="28" fill="url(#blueCard)" stroke="#69aef0" stroke-width="2.5"/><rect x="24" y="22" width="50" height="28" rx="14" fill="#69aef0"/><text x="49" y="41" text-anchor="middle" class="number">02</text><text x="26" y="96" class="cardTitle">Monitoring API</text><text x="26" y="126" class="cardSub">FastAPI · REST · contratos autorais</text><path d="M26 154H394" stroke="#3b6388"/>
      <g transform="translate(26 178)"><rect width="178" height="77" rx="15" fill="#10263c"/><text x="16" y="27" class="label">Sessions</text><text x="16" y="49" class="tiny">Criar · consultar · concluir</text></g><g transform="translate(216 178)"><rect width="178" height="77" rx="15" fill="#10263c"/><text x="16" y="27" class="label">Flight context</text><text x="16" y="49" class="tiny">GET · PUT · DELETE</text></g>
      <g transform="translate(26 267)"><rect width="178" height="77" rx="15" fill="#10263c"/><text x="16" y="27" class="label">Attention</text><text x="16" y="49" class="tiny">Eventos · estado atual</text></g><g transform="translate(216 267)"><rect width="178" height="77" rx="15" fill="#10263c"/><text x="16" y="27" class="label">Weather adapter</text><text x="16" y="49" class="tiny">Valida · normaliza METAR</text></g><text x="26" y="385" class="tiny">Backend desenvolvido · fonte canônica da sessão</text></g>

    <g transform="translate(797 575)" filter="url(#shadow)"><rect width="356" height="78" rx="20" fill="#0c1d2d" stroke="#4d83b1" stroke-width="2"/><ellipse cx="45" cy="29" rx="20" ry="9" fill="#173651" stroke="#69aef0" stroke-width="2"/><path d="M25 29v24c0 6 9 10 20 10s20-4 20-10V29" fill="#173651" stroke="#69aef0" stroke-width="2"/><text x="82" y="33" class="cardTitle" style="font-size:20px">PostgreSQL</text><text x="82" y="57" class="tiny">Sessões · contexto · eventos</text></g>

    <g transform="translate(1323 176)" filter="url(#shadow)"><rect width="300" height="302" rx="26" fill="url(#amberCard)" stroke="#f0bd5c" stroke-width="2.5"/><rect x="22" y="22" width="50" height="28" rx="14" fill="#f0bd5c"/><text x="47" y="41" text-anchor="middle" class="number">03</text><text x="24" y="94" class="cardTitle">AviationWeather</text><text x="24" y="123" class="cardSub">Public Data API</text><path d="M24 151H276" stroke="#725d2a"/><g transform="translate(101 175)"><path d="M0 35h98M49 0v76M18 15l31 20 31-20" fill="none" stroke="#f0bd5c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150" y="274" text-anchor="middle" class="cardText">METAR · HTTPS · JSON</text></g>

    <path d="M254 325H328" class="flowBlue"/><g transform="translate(275 292)"><circle cx="14" cy="14" r="14" fill="#69aef0"/><text x="14" y="19" text-anchor="middle" class="number">1</text></g>
    <path d="M658 325H755" class="flowTeal"/><g transform="translate(694 276)"><rect width="84" height="29" rx="14" fill="#0b1b29" stroke="#2e6874"/><text x="42" y="19" text-anchor="middle" class="tiny">REST / JSON</text></g><text x="706" y="363" text-anchor="middle" class="tiny">GET · POST · PUT · DELETE</text>
    <path d="M1185 325H1313" class="flowTeal"/><g transform="translate(1219 276)"><rect width="82" height="29" rx="14" fill="#231e0d" stroke="#725d2a"/><text x="41" y="19" text-anchor="middle" class="tiny">GET METAR</text></g><text x="1249" y="363" text-anchor="middle" class="tiny">JSON normalizado</text>
    <path d="M975 532V565" class="flowBlue"/><text x="1001" y="558" class="tiny">SQLAlchemy</text>
    <g transform="translate(1282 523)"><rect width="342" height="84" rx="17" fill="#0a1925" stroke="#29465c"/><circle cx="31" cy="31" r="14" fill="#43ded3" opacity=".16"/><path d="M25 31h12M31 25v12" stroke="#43ded3" stroke-width="2"/><text x="56" y="29" class="label">Fronteira controlada</text><text x="56" y="53" class="tiny">O browser nunca chama a API externa.</text></g>
  </g>

  <g transform="translate(58 866)"><rect width="1684" height="205" rx="28" fill="#17170f" stroke="#7c672e" stroke-width="2" stroke-dasharray="12 9"/><text x="34" y="43" class="eyebrow" style="fill:#f0bd5c">EXTENSÃO OPCIONAL DO ECOSSISTEMA</text><text x="34" y="76" class="section">ATTENTION CORE · CAPACIDADE OPCIONAL</text>
    <g transform="translate(465 30)"><rect width="330" height="142" rx="22" fill="#242011" stroke="#f0bd5c" stroke-width="2"/><circle cx="42" cy="45" r="18" fill="none" stroke="#f0bd5c" stroke-width="3"/><circle cx="42" cy="45" r="6" fill="#f0bd5c"/><text x="76" y="42" class="cardTitle" style="font-size:21px">Core nativo</text><text x="76" y="67" class="tiny">Webcam · calibração · EAR · PERCLOS</text><text x="28" y="109" class="cardText">Executa localmente com UI e áudio opcionais</text></g>
    <g transform="translate(904 30)"><rect width="330" height="142" rx="22" fill="#242011" stroke="#f0bd5c" stroke-width="2"/><path d="M28 31h40v28H28zM38 68h20" fill="none" stroke="#f0bd5c" stroke-width="3"/><text x="86" y="42" class="cardTitle" style="font-size:21px">core-demo</text><text x="86" y="67" class="tiny">Observações determinísticas · CI / Compose</text><text x="28" y="109" class="cardText">Sem câmera, janela gráfica ou áudio</text></g>
    <path d="M795 101H845M904 101H845" class="flowAmberLine"/><circle cx="845" cy="101" r="5" fill="#f0bd5c"/><text x="849" y="89" text-anchor="middle" class="tiny">dois modos · mesmo domínio</text><path d="M845 107V180H1220Q1250 180 1250 150V-150Q1250-170 1230-170H1165V-179" class="flowAmber"/><text x="1050" y="198" text-anchor="middle" class="tiny">AttentionEvent v1 · POST /events</text>
    <g transform="translate(1275 70)"><rect width="355" height="92" rx="17" fill="#201d11"/><text x="18" y="29" class="label">Integração adicional</text><text x="18" y="53" class="tiny">Usa uma MonitoringSession existente.</text><text x="18" y="75" class="tiny">O Compose obrigatório permanece hardware-free.</text></g>
  </g>

  <g transform="translate(58 1092)"><circle cx="7" cy="7" r="6" fill="#43ded3"/><text x="22" y="12" class="tiny">fluxo obrigatório</text><circle cx="162" cy="7" r="6" fill="#f0bd5c"/><text x="177" y="12" class="tiny">extensão opcional</text><text x="1684" y="12" text-anchor="end" class="tiny">AeroEyes · documentação #09A · 2026</text></g>
</svg>
